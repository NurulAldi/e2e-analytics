version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: orders

models:
  - name: stg_orders
    description: "Staging model untuk data order, hasil pembersihan dari raw.orders"
    columns:
      - name: order_date
        tests:
          - not_null
      - name: customer_id
        tests:
          - not_null